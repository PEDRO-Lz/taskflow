# Mesmo script que o docker-compose montava por bind mount
# (infra/postgres-init-multiple-databases.sh) vira ConfigMap aqui,
# montado dentro do pod do jeito que o bind mount fazia no compose.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  postgres-init-multiple-databases.sh: |
    #!/bin/bash
    set -e
    set -u

    function create_database() {
    	local database=$1
    	echo "  Creating database '$database'"
    	psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
    	    CREATE DATABASE "$database";
    EOSQL
    }

    if [ -n "${POSTGRES_MULTIPLE_DATABASES:-}" ]; then
    	echo "Multiple database creation requested: $POSTGRES_MULTIPLE_DATABASES"
    	for db in $(echo "$POSTGRES_MULTIPLE_DATABASES" | tr ',' ' '); do
    		create_database "$db"
    	done
    	echo "Multiple databases created"
    fi
