services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow_auth
      POSTGRES_MULTIPLE_DATABASES: taskflow_tasks
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres-init-multiple-databases.sh:/docker-entrypoint-initdb.d/postgres-init-multiple-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Simula SQS e SNS localmente. Sobe vazio
  # Quem cria o tópico/fila/assinatura é o serviço terraform
  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs,sns
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
  # Cria os recursos AWS simulados via Terraform services só sobem depois
  # dele. para o tópico SNS e a fila SQS já existirem
  # quando os dois começam a publicar/consumir.
  terraform:
    image: hashicorp/terraform:1.13
    working_dir: /workspace
    volumes:
      - ./infra/terraform:/workspace
    entrypoint: ["/bin/sh", "-c"]
    command: ["terraform init && terraform apply -auto-approve"]
    environment:
      # Rodando dentro do compose, o LocalStack é outro container
      # Fora do compose (no host), a variável usa
      # o valor padrão dela (localhost:4566).
      TF_VAR_localstack_endpoint: http://localstack:4566
    depends_on:
      localstack:
        condition: service_healthy

  auth-service:
    build: ./auth-service
    ports:
      - "3001:3001"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: taskflow
      DB_PASS: taskflow
      DB_NAME: taskflow_auth
      JWT_SECRET: secret
      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:user-events
    depends_on:
      postgres:
        condition: service_healthy
      terraform:
        condition: service_completed_successfully

  tasks-service:
    build: ./tasks-service
    ports:
      - "3002:3002"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: taskflow
      DB_PASS: taskflow
      DB_NAME: taskflow_tasks
      JWT_SECRET: secret
      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_QUEUE_URL: http://localstack:4566/000000000000/user-events-tasks-queue
    depends_on:
      postgres:
        condition: service_healthy
      terraform:
        condition: service_completed_successfully

volumes:
  pg-data:
